name: Module 4 - Secrets and Variables

on:
  workflow_dispatch:

jobs:
  secrets-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print Repository Variable
        run: echo "Variable Value is ${{ vars.MY_VAR }}"

      - name: Access Encrypted Secret Safely
        env:
          SECRET_VAL: ${{ secrets.MY_SECRET }}
        run: echo "Secret value is accessed safely in step env"

      - name: Test GITHUB_TOKEN REST API Call
        run: |
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               https://api.github.com/repos/${{ github.repository }}
