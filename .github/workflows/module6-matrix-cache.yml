name: Module 6 - Matrix Builds Caching and Service Containers

on:
  workflow_dispatch:

jobs:
  matrix-build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache Dependencies Step
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-cache

      - name: Verify Node Installation
        run: node -v

  service-container-job:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Check Redis Service Container
        run: echo "Redis service container is initialized and running on port 6379"
